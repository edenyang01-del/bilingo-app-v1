name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure Release Keystore
        run: |
          cd android/app
          if [ -f "release.keystore" ]; then
            echo "Using release.keystore"
          elif [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from secret..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "bilingokey" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "bilingo123456" \
              -keypass "bilingo123456" \
              -dname "CN=Bilingo, OU=Radio, O=Bilingo, L=Taipei, C=TW"
          fi

      - name: Build Android App Bundle (AAB) & APK
        env:
          RELEASE_STORE_PASSWORD: "bilingo123456"
          RELEASE_KEY_ALIAS: "bilingokey"
          RELEASE_KEY_PASSWORD: "bilingo123456"
        run: |
          cd android
          gradle assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload Release AAB to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
