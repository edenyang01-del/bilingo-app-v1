name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure Release Keystore
        run: |
          cd android/app
          STORE_PASS="${{ secrets.RELEASE_STORE_PASSWORD }}"
          KEY_PASS="${{ secrets.RELEASE_KEY_PASSWORD }}"
          KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
          
          STORE_PASS="${STORE_PASS:-bilingo123456}"
          KEY_PASS="${KEY_PASS:-$STORE_PASS}"
          KEY_ALIAS="${KEY_ALIAS:-bilingokey}"
          
          KEYSTORE_VALID=false
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Attempting to restore keystore from RELEASE_KEYSTORE_BASE64..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d ' \n\r' | base64 -d > release.keystore 2>/dev/null || true
            if [ -s release.keystore ] && keytool -list -keystore release.keystore -storepass "$STORE_PASS" >/dev/null 2>&1; then
              echo "Keystore restored and verified successfully from secret."
              KEYSTORE_VALID=true
            else
              echo "Restored keystore was invalid or storepass did not match, removing corrupted file..."
              rm -f release.keystore
            fi
          fi

          if [ "$KEYSTORE_VALID" = "false" ]; then
            echo "Generating fresh release keystore using keytool..."
            rm -f release.keystore
            keytool -genkeypair -v -keystore release.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Bilingo, OU=Radio, O=Bilingo, L=Taipei, ST=Taiwan, C=TW"
          fi

      - name: Build Web App and Sync to Android Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Build Android App Bundle (AAB) & APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          export RELEASE_STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-bilingo123456}"
          export RELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
          export RELEASE_KEY_ALIAS="${RELEASE_KEY_ALIAS:-bilingokey}"
          ./gradlew assembleRelease bundleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload Release AAB to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
