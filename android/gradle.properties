# Project-level Gradle settings.
# Specifies JVM arguments for Gradle Daemon with optimized garbage collection and 6GB heap space.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions -XX:G1NewSizePercent=20 -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC

# AndroidX package structure enabled
android.useAndroidX=true

# Enables non-transitive R classes to reduce memory & build time
android.nonTransitiveRClass=true

# Disable build features not used to save Gradle memory
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false

# Incremental compilation & build caching
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true


