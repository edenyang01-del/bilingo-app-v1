# Project-level Gradle settings.
# Optimized JVM memory settings for CI / GitHub Actions environment (prevents OOM killer)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:+UseG1GC

# AndroidX package structure enabled
android.useAndroidX=true

# Enables non-transitive R classes to reduce memory & build time
android.nonTransitiveRClass=true

# Disable build features not used to save Gradle memory
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false

# Incremental compilation & build caching
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false



